[package]
name = "les-runtime"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license-file = "../LICENSE"
description = "Native owner of LES services during the staged runtime migration"

[dependencies]
les-core = { path = "../core" }
serde_json = { version = "=1.0.150", features = ["arbitrary_precision"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "json"] }
getrandom = "=0.3.4"

[profile.release]
lto = true
codegen-units = 1
strip = true

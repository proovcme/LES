[package]
name = "les-vector"
version = "0.1.0"
edition = "2024"
license-file = "../LICENSE"
description = "Owned Qdrant Edge storage and resumable LES index migration"

[dependencies]
les-core = { path = "../core" }
qdrant-edge = "=0.9.0"
serde_json = { version = "=1.0.150", features = ["float_roundtrip", "arbitrary_precision"] }
sha2 = "=0.10.9"
rusqlite = { version = "=0.41.1", features = ["bundled"] }

[profile.dev]
debug = 0
opt-level = 1

[profile.release]
lto = true
codegen-units = 1
strip = true

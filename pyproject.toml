[project]
name = "les-v2"
version = "0.1.3"
description = "Л.Е.С. — Локальная Экспертная Система"
readme = "README.md"
requires-python = ">=3.12,<3.14"

dependencies = [
    # ── API сервер ───────────────────────────────────────────────
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",        # [standard] = uvloop + httptools
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1.0",
    "httpx>=0.27.0",
    "psutil>=5.9.0",
    # ── RAG / Qdrant ─────────────────────────────────────────────
    "qdrant-client>=1.11.0",
    "llama-index-core>=0.10.0",
    "llama-index-vector-stores-qdrant>=0.2.0",
    "llama-index-embeddings-openai>=0.1.0",
    "llama-index-embeddings-ollama>=0.1.0",
    # ── Конвертация документов ───────────────────────────────────
    "pypdfium2==5.8.0",
    "mammoth>=1.8.0",
    "openpyxl>=3.1.0",
    "pandas>=2.0.0",
    "tabulate==0.10.0",               # pandas.to_markdown for CSV/XLS(X)
    "xlrd>=2.0.1",
    "pyarrow>=16.0.0",
    "python-oxmsg==0.0.2",
    "pdfplumber>=0.11.0",
    "Pillow>=10.0.0",
    "markitdown>=0.0.1",
    "ezdxf>=1.3.0",
    # ── UI ───────────────────────────────────────────────────────
    "nicegui>=2.0.0",
    # ── Утилиты ──────────────────────────────────────────────────
    "python-dotenv>=1.0.0",
    "aiofiles>=23.0.0",
    "python-docx>=1.2.0",
]

[project.optional-dependencies]
windows-reranker = [
    "sentence-transformers>=3.0.0",
    "torch>=2.2.0",
    "FlagEmbedding>=1.3.5",
]
parsers = [
    "docling>=2.101.0",
]
mail-pst = [
    # Архивы Outlook .pst (Windows). C-сборка libpff (self-contained, нужен компилятор).
    "libpff-python>=20231205",
]
mcp = [
    # MCP-сервер ЛЕС (tools/les_mcp_server.py): инструменты ЛЕС наружу по Model Context Protocol.
    "mcp>=1.0.0",
]

[dependency-groups]
skill-runtime = [
    "numpy",
    "openpyxl>=3.1.0",
    "pandas>=2.0.0",
    "pyarrow>=16.0.0",
    "pypdfium2==5.8.0",
    "pdfplumber>=0.11.0",
    "Pillow>=10.0.0",
    "python-docx>=1.2.0",
    "ezdxf>=1.3.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]
dev = ["markdown-it-py>=4.0", "pytest>=8.0", "pytest-asyncio>=1.0", "pytest-subtests>=0.14"]

[project.scripts]
les-install = "tools.install_les:main"
les-runtime = "tools.les_runtime_control:main"
lesctl = "tools.lesctl:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "proxy", "proxy.routers", "proxy.services", "proxy.storage", "sovushka", "tools"]
include = ["lemonade_host.py", "proxy_server.py", "sovushka_ng.py"]

[tool.uv]

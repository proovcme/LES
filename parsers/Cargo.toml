[package]
name = "les-document-parsers"
version = "0.1.0"
edition = "2021"
publish = false
license-file = "../LICENSE"
description = "Isolated native Word structure and PDF table parsers for LES"

[dependencies]
docling = { version = "=2.82.1", default-features = false, features = ["pdf-text", "preserve-order"] }
docling-core = { version = "=2.82.1", default-features = false }
xberg = { version = "=1.3.10", default-features = false, features = ["tokio-runtime", "pdf"] }
tokio = { version = "=1.54.1", features = ["rt", "time"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
zip = { version = "=9.5.1", default-features = false }

[profile.dev]
debug = 0
incremental = false

[profile.release]
debug = 0
incremental = false
strip = true

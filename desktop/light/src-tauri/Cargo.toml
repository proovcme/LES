[package]
name = "les-light"
version = "0.1.0"
description = "LES RAG desktop"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["tray-icon"] }
serde_json = "1.0"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"

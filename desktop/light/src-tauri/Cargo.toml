[package]
name = "les-light"
version = "0.1.1"
description = "LES RAG desktop"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["tray-icon"] }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"

[package]
name = "les-core"
version = "0.1.0"
edition = "2021"
license-file = "../LICENSE"
description = "Bounded native document operations for LES"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = { version = "=1.0.150", features = ["float_roundtrip", "arbitrary_precision"] }
sha2 = "=0.10.9"
regex = "=1.12.3"
rusqlite = { version = "=0.41.1", features = ["bundled", "functions"] }
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
calamine = "=0.37.0"
zip = { version = "=9.4.1", default-features = false }
getrandom = "=0.3.4"

[profile.release]
lto = true
codegen-units = 1
strip = true

[package]
name = "les-core"
version = "0.1.0"
edition = "2021"
license-file = "../LICENSE"
description = "Bounded native document operations for LES"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = "=1.0.150"
sha2 = "=0.10.9"
regex = "=1.12.3"

[profile.release]
lto = true
codegen-units = 1
strip = true

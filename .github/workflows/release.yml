name: LES RAG candidate package
# Manual candidate artifact; never an automatic public release.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: les-rag-candidate
  cancel-in-progress: false
jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      PYTHONUTF8: '1'
      UV_PYTHON: '3.13.12'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
          cache-dependency-path: desktop/light/frontend/package-lock.json
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.13.12'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            desktop/light/src-tauri
            core
          cache-on-failure: true
      - name: Build desktop shell
        run: cargo build --locked --release --manifest-path desktop/light/src-tauri/Cargo.toml
      - name: Build locked static frontend
        run: uv run --no-project python -m tools.build_light_frontend
      - name: Build native service owner and API
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/core/target
        run: |
          uv run --no-project python -m tools.build_native_runtime --output native/runtime
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          uv run --no-project python -m tools.build_native_api --output native/api
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build pinned offline payload
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/core/target
        run: uv run --no-project python -m tools.build_light_package --output dist/payload --desktop-exe desktop/light/src-tauri/target/release/les-light.exe --native-runtime native/runtime/les-runtime.exe --native-api native/api/les-api.exe
      - name: Validate packaged files
        run: pwsh -NoProfile -File installers/windows/light/package.ps1 -Mode Validate -Source dist/payload
      - name: Check indexed chat and explicit PDF reading with the candidate payload
        shell: pwsh
        run: |
          uv sync --frozen
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:LES_TEST_NATIVE_API = (Resolve-Path dist/payload/native/api/les-api.exe).Path
          $env:LES_TEST_NATIVE_QDRANT = (Resolve-Path dist/payload/native/qdrant/qdrant.exe).Path
          $build = (Get-Content config/version.json -Raw | ConvertFrom-Json).build_number
          $env:LES_TEST_OPTIONAL_SKILL_ARCHIVE = (Resolve-Path "dist/payload-assets/LES-Skill-Python-$build.zip").Path
          uv run python tools/build_native_core.py --output native/core
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:LES_CORE_LIBRARY = (Resolve-Path native/core/les_core.dll).Path
          $env:LES_CORE_MODE = 'native'
          uv run python -m pytest -q tests/test_light_native_pdf_layout.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          uv run python -m pytest -q tests/test_light_native_retrieval_modes.py -k indexed_turn
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          uv run python -m pytest -q tests/test_light_native_chat_turn.py -k "external_python_skill or unapproved_external_skill"
      - name: Build offline and web installers
        shell: pwsh
        run: |
          $nsis = 'C:/Program Files (x86)/NSIS/makensis.exe'
          if (-not (Test-Path -LiteralPath $nsis)) { choco install nsis --yes --no-progress }
          uv run --no-project python -m tools.build_light_installers --payload dist/payload --output dist/installers --makensis $nsis
      - uses: actions/upload-artifact@v4
        with:
          name: LES-RAG-candidate-${{ github.sha }}
          path: dist/installers
          if-no-files-found: error
          retention-days: 14

  installed:
    name: Windows installed · ${{ matrix.scenario }}
    needs: package
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        scenario: [fresh, upgrade]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: LES-RAG-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/les-candidate
      - name: Install and start the exact candidate
        env:
          LES_INSTALL_SCENARIO: ${{ matrix.scenario }}
        run: .github/scripts/check-installed-candidate.ps1 -Candidate (Join-Path $env:RUNNER_TEMP 'les-candidate') -Scenario $env:LES_INSTALL_SCENARIO

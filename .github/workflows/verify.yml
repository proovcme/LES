name: LES RAG checks
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: les-checks-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  checks:
    name: Format, static contracts and publication
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      UV_FROZEN: '1'
    steps:
      - uses: actions/checkout@v4
      # These checks do not compile dependencies or wait for native binaries.
      - name: Check all Rust formatting first
        run: |
          foreach ($crate in 'core', 'runtime', 'api', 'parsers', 'vector', 'desktop/light/src-tauri') {
            cargo fmt --manifest-path "$crate/Cargo.toml" --check
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.13.12'
          enable-cache: true
      - name: Prepare contract checks
        run: |
          choco install make --yes --no-progress
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          uv sync --frozen --extra mcp
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify contracts and publication
        run: make pre-push
  frontend:
    name: Frontend types and behavior
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
          cache-dependency-path: desktop/light/frontend/package-lock.json
      - run: npm ci --prefix desktop/light/frontend
      - run: npm run check --prefix desktop/light/frontend
      - run: npm test --prefix desktop/light/frontend
  windows:
    name: Native build and full behavior
    needs: [checks, frontend]
    runs-on: windows-2022
    # Preserve the complete behavior gate even on a cold runner.
    timeout-minutes: 150
    env:
      PYTHONUTF8: '1'
      UV_FROZEN: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      # Optimized acceptance binaries; installer optimization stays in release.yml.
      # Full LTO and dependency debug symbols made feedback take over two hours.
      CARGO_PROFILE_RELEASE_LTO: 'false'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
      CARGO_PROFILE_RELEASE_OPT_LEVEL: '2'
      # The core builder and all service builders share dependency artifacts.
      CARGO_TARGET_DIR: ${{ github.workspace }}/core/target
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
          cache-dependency-path: desktop/light/frontend/package-lock.json
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.13.12'
          enable-cache: true
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core -> target
            runtime -> ../core/target
            api -> ../core/target
            parsers -> ../core/target
          cache-on-failure: true
      - name: Prepare build tools
        run: choco install make --yes --no-progress
      - name: Install frozen Python environment
        run: uv sync --frozen --extra mcp
      - name: Reuse the asset compiler flags for Rust tests
        run: |
          $flags = uv run python -c "from tools.native_asset import remapped_rustflags; print(remapped_rustflags())"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "CARGO_ENCODED_RUSTFLAGS=$flags" >> $env:GITHUB_ENV
      - name: Build and test native document core
        run: |
          cargo test --locked --release --manifest-path core/Cargo.toml
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          uv run python tools/build_native_core.py --output native/core
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "LES_CORE_LIBRARY=$((Resolve-Path native/core/les_core.dll).Path)" >> $env:GITHUB_ENV
          "LES_CORE_MODE=native" >> $env:GITHUB_ENV
      - name: Test and build native service owner and API
        run: |
          cargo test --locked --release --manifest-path runtime/Cargo.toml
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked --release --manifest-path api/Cargo.toml --features edge
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          uv run python tools/build_native_runtime.py --output native/runtime
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          uv run python tools/build_native_api.py --output native/api
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          uv run python tools/build_native_api.py --output native/edge-api --edge
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          uv run python tools/light_runtime_assets.py --destination native/qdrant
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "LES_TEST_NATIVE_RUNTIME=$((Resolve-Path native/runtime/les-runtime.exe).Path)" >> $env:GITHUB_ENV
          "LES_TEST_NATIVE_API=$((Resolve-Path native/api/les-api.exe).Path)" >> $env:GITHUB_ENV
          "LES_TEST_EDGE_API=$((Resolve-Path native/edge-api/les-api.exe).Path)" >> $env:GITHUB_ENV
          "LES_TEST_NATIVE_QDRANT=$((Resolve-Path native/qdrant/qdrant.exe).Path)" >> $env:GITHUB_ENV
      - name: Retain native candidates for isolated acceptance
        uses: actions/upload-artifact@v4
        with:
          name: LES-native-candidate-${{ github.sha }}
          path: |
            native/core/les_core.dll
            native/core/core-receipt.json
            native/runtime/les-runtime.exe
            native/runtime/runtime-receipt.json
            native/api/les-api.exe
            native/api/api-receipt.json
          if-no-files-found: error
          retention-days: 7
      - name: Build native Word and PDF table parsers
        run: |
          uv run python tools/native_asset.py parsers --output native/parsers
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "LES_TEST_NATIVE_DOCUMENT_PARSERS=$((Resolve-Path native/parsers/les-document-parsers.exe).Path)" >> $env:GITHUB_ENV
      - name: Retain native parsers for isolated acceptance
        uses: actions/upload-artifact@v4
        with:
          name: LES-parsers-candidate-${{ github.sha }}
          path: |
            native/parsers/les-document-parsers.exe
            native/parsers/parser-receipt.json
          if-no-files-found: error
          retention-days: 7
      - name: Build frontend for integration tests
        run: |
          uv run python tools/build_light_frontend.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify code and offline behavior
        run: |
          make verify
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          make test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          make test-mail
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
  desktop:
    name: Windows desktop
    needs: [checks, frontend]
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/light/src-tauri
          cache-on-failure: true
      - name: Build Windows desktop shell
        run: cargo build --locked --release --manifest-path desktop/light/src-tauri/Cargo.toml

  merge_gate:
    name: LES merge gate
    if: ${{ always() }}
    needs: [checks, frontend, windows, desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require successful checks
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          if [ "$RESULTS" != 'success success success success' ]; then
            printf 'Cannot merge. Required job results: %s\n' "$RESULTS" >&2
            exit 1
          fi
